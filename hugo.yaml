# Configuration
title: "Shawy's Blog"

# import hextra as module
module:
  imports:
  - path: github.com/imfing/hextra
  - path: github.com/alecthomas/chroma/v2


enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
enableKatex: true
enableKatexMath: true
hasCJKLanguage: true


outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML, RSS]

markup:
  highlight:
    style: "nord"
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
        enable: true

enableInlineShortcodes: true

menu:
  main:
    - name: 文档
      pageRef: /docs
      weight: 1
    - name: 关于
      pageRef: /about
      weight: 2
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/shawyxy"
      params:
        icon: github

  # sidebar:
    # - identifier: more
    #   name: More
    #   params:
    #     type: separator
    #   weight: 1
    # - identifier: about
    #   name: "About"
    #   pageRef: "/about"
    #   weight: 2

params:
  description: ""
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true

    # logo:
    #   path: images/logo.svg
    #   dark: images/logo-dark.svg
      # width: 40
      # height: 20
      # link: /
    # width: wide

  page:
    # full (100%), wide (90rem), normal (1280px)
    width: wide

  theme:
    # light | dark | system
    default: system
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  # Search
  # flexsearch is enabled by default
  search:
    enable: true
    type: flexsearch

    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: forward

  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"

  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  comments:
    enable: true
    type: giscus

    giscus:
      repo: "shawyxy/shawyxy.github.io"
      repoId: "R_kgDOLxf-pA"
      category: "Announcements"
      categoryId: "DIC_kwDOLxf-pM4Cm5D5"
      data-mapping: "pathname"

services:
  googleAnalytics:
    ID: G-MEASUREMENT_ID